<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Showcase AI Dashboard</title>
  <style>
    :root {
      --bg: #f4f8f7;
      --card: #ffffff;
      --ink: #1b2430;
      --muted: #5e6a76;
      --brand: #0f766e;
      --accent: #f59e0b;
      --danger: #dc2626;
      --line: #d8e1e8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 10% 10%, #e6fffa 0%, #f4f8f7 45%, #edf4ff 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .container {
      width: min(1200px, 94vw);
      margin: 24px auto;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(12, 1fr);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      padding: 16px;
    }

    .hero { grid-column: span 12; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .hero h1 { margin: 0; font-size: 1.35rem; }
    .badge { background: #dcfce7; color: #166534; border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; }

    .chat { grid-column: span 7; }
    .side { grid-column: span 5; display: grid; gap: 16px; }
    .grid { display: grid; gap: 8px; }

    .row { display: flex; gap: 8px; align-items: center; }
    input, select, button, textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }

    input, textarea, select { width: 100%; }
    button {
      cursor: pointer;
      background: var(--brand);
      color: white;
      border: 0;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: translateY(1px); }
    .btn-secondary { background: #0b4a8f; }
    .btn-warning { background: var(--accent); color: #1b2430; }

    .panel-title { margin: 0 0 8px; font-size: 1rem; font-weight: 700; }
    .sub { color: var(--muted); font-size: 0.9rem; }

    .messages {
      border: 1px solid var(--line);
      border-radius: 12px;
      height: 280px;
      overflow: auto;
      padding: 10px;
      background: #fafcfd;
      margin-bottom: 10px;
    }

    .message { margin: 8px 0; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; }
    .m-user { background: #dbeafe; }
    .m-assistant { background: #e2fbe8; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .kpi {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }

    .kpi .value { font-size: 1.2rem; font-weight: 700; }
    .list {
      max-height: 180px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #fcfdfe;
    }

    .item { padding: 8px; border-bottom: 1px dashed #e5edf3; }
    .item:last-child { border-bottom: 0; }
    .err { color: var(--danger); font-weight: 700; }

    @media (max-width: 980px) {
      .chat, .side { grid-column: span 12; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card hero">
      <div>
        <h1>Public Showcase AI Assistant Dashboard</h1>
        <div class="sub">FastAPI + modular assistant + observability + optional voice adapters</div>
      </div>
      <div class="badge" id="status-badge">Loading health...</div>
    </section>

    <section class="card chat">
      <h2 class="panel-title">Assistant Chat</h2>
      <div class="messages" id="messages"></div>
      <div class="row">
        <input id="chat-input" placeholder="Try: Add a task: prepare recruiter demo" />
        <button id="send-chat">Send</button>
      </div>
      <div class="sub" id="chat-meta">No requests yet.</div>
    </section>

    <section class="side">
      <div class="card">
        <h2 class="panel-title">System Health</h2>
        <div class="kpi-grid" id="health-kpis"></div>
      </div>

      <div class="card">
        <h2 class="panel-title">Create Reminder</h2>
        <div class="row">
          <input id="reminder-text" placeholder="Follow up with startup application" />
          <input id="reminder-minutes" type="number" value="15" min="1" />
        </div>
        <div class="row" style="margin-top: 8px;">
          <button class="btn-secondary" id="create-reminder">Schedule</button>
          <button class="btn-warning" id="refresh-reminders">Refresh</button>
        </div>
        <div class="list" id="reminders-list" style="margin-top: 8px;"></div>
      </div>

      <div class="card">
        <h2 class="panel-title">Notes and Tasks</h2>
        <div class="row">
          <button id="refresh-notes">Refresh Notes</button>
          <button id="refresh-tasks" class="btn-secondary">Refresh Tasks</button>
        </div>
        <div class="sub" style="margin-top: 8px;">Recent Notes</div>
        <div class="list" id="notes-list"></div>
        <div class="sub" style="margin-top: 8px;">Recent Tasks</div>
        <div class="list" id="tasks-list"></div>
      </div>

      <div class="card">
        <h2 class="panel-title">Observability</h2>
        <div class="row">
          <button id="refresh-observability">Refresh Metrics</button>
        </div>
        <div class="sub" id="obs-summary" style="margin-top: 8px;">No metrics loaded.</div>
        <div class="list" id="tool-usage" style="margin-top: 8px;"></div>
      </div>
    </section>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const statusBadge = document.getElementById("status-badge");
    const chatMeta = document.getElementById("chat-meta");

    function getHeaders() {
      const token = window.localStorage.getItem("showcase_api_token") || "";
      return token ? {"Content-Type": "application/json", "x-api-token": token} : {"Content-Type": "application/json"};
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: options.body ? getHeaders() : (getHeaders()),
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`API ${response.status}: ${detail}`);
      }
      return response.json();
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role === "user" ? "m-user" : "m-assistant"}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadHealth() {
      const health = await api("/health");
      statusBadge.textContent = `Status ${health.status.toUpperCase()} | CPU ${health.cpu_percent}% | RAM ${health.memory_percent}%`;

      const kpis = [
        ["Messages", health.messages],
        ["Notes", health.notes],
        ["Tasks", health.tasks],
        ["Reminders", health.reminders],
      ];

      const host = document.getElementById("health-kpis");
      host.innerHTML = "";
      for (const [label, value] of kpis) {
        const card = document.createElement("div");
        card.className = "kpi";
        card.innerHTML = `<div class="sub">${label}</div><div class="value">${value}</div>`;
        host.appendChild(card);
      }
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";
      const t0 = performance.now();
      try {
        const payload = await api("/chat", {
          method: "POST",
          body: JSON.stringify({message: text}),
        });
        addMessage("assistant", payload.content || "No response");
        chatMeta.textContent = `Type: ${payload.type} | Tools: ${(payload.tools_used || []).join(", ") || "none"} | ${Math.round(performance.now()-t0)} ms`;
      } catch (err) {
        addMessage("assistant", `Error: ${err.message}`);
      }
    }

    async function loadReminders() {
      const data = await api("/reminders");
      const host = document.getElementById("reminders-list");
      host.innerHTML = "";
      const items = data.reminders || [];
      if (!items.length) {
        host.textContent = "No reminders yet.";
        return;
      }
      for (const r of items.slice(0, 8)) {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `#${r.id} ${r.message} [${r.status}] due ${r.due_at}`;
        host.appendChild(div);
      }
    }

    async function createReminder() {
      const message = document.getElementById("reminder-text").value.trim();
      const minutes = Number(document.getElementById("reminder-minutes").value || "15");
      if (!message) return;
      await api("/reminders", {
        method: "POST",
        body: JSON.stringify({message, minutes}),
      });
      document.getElementById("reminder-text").value = "";
      await loadReminders();
    }

    async function loadNotesAndTasks() {
      const [notes, tasks] = await Promise.all([api("/notes"), api("/tasks")]);
      const notesEl = document.getElementById("notes-list");
      const tasksEl = document.getElementById("tasks-list");
      notesEl.innerHTML = "";
      tasksEl.innerHTML = "";

      (notes.notes || []).slice(0, 5).forEach((n) => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `#${n.id} ${n.title} (${n.category})`;
        notesEl.appendChild(div);
      });

      (tasks.tasks || []).slice(0, 5).forEach((t) => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `#${t.id} ${t.title} [${t.priority}/${t.status}]`;
        tasksEl.appendChild(div);
      });

      if (!notesEl.innerHTML) notesEl.textContent = "No notes yet.";
      if (!tasksEl.innerHTML) tasksEl.textContent = "No tasks yet.";
    }

    async function loadObservability() {
      const data = await api("/observability/summary");
      const metrics = data.metrics || {};
      const req = metrics.requests || {};
      const assist = metrics.assistant || {};

      document.getElementById("obs-summary").textContent =
        `Req ${req.total || 0}, Errors ${req.errors || 0}, Assistant avg ${assist.avg_response_ms || 0} ms, p95 ${assist.p95_response_ms || 0} ms`;

      const usageEl = document.getElementById("tool-usage");
      usageEl.innerHTML = "";
      const top = (metrics.tools && metrics.tools.top) || [];
      if (!top.length) {
        usageEl.textContent = "No tool usage data yet.";
        return;
      }
      top.forEach(([name, count]) => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `${name}: ${count}`;
        usageEl.appendChild(div);
      });
    }

    document.getElementById("send-chat").addEventListener("click", sendChat);
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });
    document.getElementById("create-reminder").addEventListener("click", createReminder);
    document.getElementById("refresh-reminders").addEventListener("click", loadReminders);
    document.getElementById("refresh-notes").addEventListener("click", loadNotesAndTasks);
    document.getElementById("refresh-tasks").addEventListener("click", loadNotesAndTasks);
    document.getElementById("refresh-observability").addEventListener("click", loadObservability);

    Promise.all([loadHealth(), loadReminders(), loadNotesAndTasks(), loadObservability()])
      .catch((err) => {
        statusBadge.innerHTML = `<span class="err">${err.message}</span>`;
      });
  </script>
</body>
</html>
